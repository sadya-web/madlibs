<!DOCTYPE html>
<html>
<head>
    <title>20-Word Mega Spring Mad Libs</title>
</head>
<body>
    <h1>😂 Fill in 20 Words for the Craziest Spring Story Ever</h1>
    <form method="post">
        {% for i in range(20) %}
            <label>{{ i+1 }}. {{ word_types[i] }}:</label><br>
            <input type="text" name="word{{ i }}" required><br><br>
        {% endfor %}
        <button type="submit">Make me laugh!</button>
    </form>
</body>
</html>
